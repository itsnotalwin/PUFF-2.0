name: Build compiled PUFF homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test current menu and mixer calculations
        run: npm test

      - name: Restore Vite entrypoint from source template
        run: cp index.source.html index.html

      - name: Build production website
        run: npm run build

      - name: Publish compiled homepage for branch-based Pages
        # GitHub Pages is configured to deploy from the branch.
        # Never run a second deployment workflow in parallel.
        run: |
          test -s dist/index.html
          cp dist/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "ci: sync compiled site for branch Pages [skip ci]"
            git push origin HEAD:main
          fi

